name: Build Eleventy

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

    # Run daily to refresh event data (remove past events from lists)
    schedule:
        - cron: '0 12 * * *'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - name: Use Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint && npm run format:check

            # calendarEvents.js fails the build when a calendar feed can't be
            # fetched AND there's no cached fallback (see @11ty/eleventy-fetch's
            # RemoteAssetCache#fetch). Without persisting .cache/ across runs,
            # every CI build starts with an empty cache, so that fallback could
            # never kick in here and a transient feed outage would fail every
            # build, not just the daily refresh cron. Restoring the most recent
            # cache (any day, via restore-keys) gives transient outages a real
            # stale-data fallback in CI, matching local/prod dev behavior.
            - name: Cache calendar feed data
              uses: actions/cache@v4
              with:
                  path: .cache
                  key: calendar-fetch-${{ github.run_id }}
                  restore-keys: |
                      calendar-fetch-

            - name: Build 11ty
              run: npm run build

            # Chromium is ~112 MiB; cache it so we only download on version bumps.
            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browser
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium
              timeout-minutes: 5

            # Cached browsers restore the binary but not the apt system deps.
            # Retries + a short per-attempt timeout guard against slow/flaky
            # apt mirrors turning this into a multi-minute hang.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              uses: nick-fields/retry@v3
              with:
                  timeout_minutes: 3
                  max_attempts: 3
                  command: npx playwright install-deps chromium

            - name: Run smoke tests
              run: npm run test:nobuild

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write # to deploy to Pages
            id-token: write # to verify the deployment originates from an appropriate source

        # Deploy to the github-pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
